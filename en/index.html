<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Where to eat in Rio de Janeiro: restaurants, bars and cafés." />
    <title>Where to eat</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <header class="site-header">
      <div>
        <h1>Where to eat!</h1>
        <p>Restaurants, bars and cafés in Rio de Janeiro.</p>
      </div>
      <a class="lang-switch" href="../" hreflang="pt-BR" data-locale-switch>Português</a>
    </header>

    <main class="site-main">
      <form id="filters" class="filters" role="search">
        <label class="field field-search">
          <span class="field-label">Search</span>
          <input class="input" type="search" name="q" placeholder="Name, cuisine or neighbourhood" />
        </label>
        <label class="field">
          <span class="field-label">Type</span>
          <select class="input" name="amenity">
            <option value="">All</option>
            <option value="restaurant">Restaurant</option>
            <option value="fast_food">Fast food</option>
            <option value="bar">Bar</option>
            <option value="cafe">Café</option>
          </select>
        </label>
        <label class="field">
          <span class="field-label">Cuisine</span>
          <select class="input" name="cuisine">
            <option value="">All</option>
          </select>
        </label>
        <fieldset class="field span-options">
          <legend class="field-label">Open in the</legend>
          <label class="check"><input type="checkbox" name="span" value="morning" /> <span>Morning</span></label>
          <label class="check"><input type="checkbox" name="span" value="afternoon" /> <span>Afternoon</span></label>
          <label class="check"><input type="checkbox" name="span" value="night" /> <span>Night</span></label>
        </fieldset>
      </form>

      <p class="result-bar"><span id="result-count" class="result-count" aria-live="polite"></span> <a href="mapa/">View map</a></p>
      <p id="hours-note" class="result-note" hidden>Places without opening hours are hidden while filtering by hours.</p>

      <div class="table-wrap">
        <table class="places-table">
          <thead>
            <tr>
              <th scope="col">Name</th>
              <th scope="col">Type</th>
              <th scope="col">Cuisine</th>
              <th scope="col">Neighbourhood</th>
              <th scope="col">Hours</th>
            </tr>
          </thead>
          <tbody id="places-body"></tbody>
        </table>
      </div>
    </main>

    <footer class="site-footer">
      <p><a href="https://www.openstreetmap.org/copyright">Data © OpenStreetMap contributors.</a></p>
    </footer>
  </body>
</html>
