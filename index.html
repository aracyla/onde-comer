<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Onde comer no Rio de Janeiro: restaurantes, bares e cafés." />
    <title>Onde comer</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <header class="site-header">
      <div>
        <h1>Onde comer!</h1>
        <p>Restaurantes, bares e cafés do Rio de Janeiro.</p>
      </div>
      <a class="lang-switch" href="en/" hreflang="en" data-locale-switch>English</a>
    </header>

    <main class="site-main">
      <form id="filters" class="filters" role="search">
        <label class="field field-search">
          <span class="field-label">Buscar</span>
          <input class="input" type="search" name="q" placeholder="Nome, cozinha ou bairro" />
        </label>
        <label class="field">
          <span class="field-label">Tipo</span>
          <select class="input" name="amenity">
            <option value="">Todos</option>
            <option value="restaurant">Restaurante</option>
            <option value="fast_food">Lanchonete</option>
            <option value="bar">Bar</option>
            <option value="cafe">Café</option>
          </select>
        </label>
        <label class="field">
          <span class="field-label">Cozinha</span>
          <select class="input" name="cuisine">
            <option value="">Todos</option>
          </select>
        </label>
        <fieldset class="field span-options">
          <legend class="field-label">Aberto de</legend>
          <label class="check"><input type="checkbox" name="span" value="morning" /> <span>Manhã</span></label>
          <label class="check"><input type="checkbox" name="span" value="afternoon" /> <span>Tarde</span></label>
          <label class="check"><input type="checkbox" name="span" value="night" /> <span>Noite</span></label>
        </fieldset>
      </form>

      <p class="result-bar"><span id="result-count" class="result-count" aria-live="polite"></span> <a href="mapa/">Ver no mapa</a></p>
      <p id="hours-note" class="result-note" hidden>Lugares sem horário cadastrado ficam ocultos ao filtrar por horário.</p>

      <div class="table-wrap">
        <table class="places-table">
          <thead>
            <tr>
              <th scope="col">Nome</th>
              <th scope="col">Tipo</th>
              <th scope="col">Cozinha</th>
              <th scope="col">Bairro</th>
              <th scope="col">Horário</th>
            </tr>
          </thead>
          <tbody id="places-body"></tbody>
        </table>
      </div>
    </main>

    <footer class="site-footer">
      <p><a href="https://www.openstreetmap.org/copyright">Dados © colaboradores do OpenStreetMap.</a></p>
    </footer>
  </body>
</html>
